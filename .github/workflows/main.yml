name: Build DarnessTool

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DarnessTool.csproj

      - name: Publish single-file EXE
        run: >
          dotnet publish DarnessTool.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o ./publish

      - name: Show output
        run: dir ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarnessTool-win-x64
          path: ./publish/DarnessTool.exe
          retention-days: 30
